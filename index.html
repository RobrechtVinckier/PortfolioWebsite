<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robrecht Vinckier — Portfolio</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #f3f5f7;
        --muted: #a7b0be;
        --accent: #4ee1a0;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(1200px 600px at 20% -10%, #24304a 0%, var(--bg) 50%),
                    radial-gradient(800px 500px at 110% 10%, #1c3b2d 0%, var(--bg) 55%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .card {
        width: min(720px, 100%);
        background: linear-gradient(180deg, #1c2029 0%, var(--card) 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        color: var(--accent);
        letter-spacing: 0.12em;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
      }

      h1 {
        margin: 10px 0 6px;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
      }

      ul {
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      li::before {
        content: "•";
        color: var(--accent);
        margin-right: 8px;
      }

      .status {
        margin-top: 18px;
        padding: 10px 12px;
        background: rgba(78, 225, 160, 0.08);
        border: 1px solid rgba(78, 225, 160, 0.2);
        border-radius: 10px;
        font-size: 14px;
      }

      .status strong { color: var(--accent); }

      .footer {
        margin-top: 16px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Portfolio Website</div>
      <h1>Work in progress</h1>
      <p>Building a clean, fast portfolio with a custom design.</p>

      <ul>
        <li>Domain and hosting configured</li>
        <li>Git deployment working</li>
        <li>Design and content underway</li>
      </ul>

      <div class="status" id="status"></div>
      <div class="footer" id="timestamp"></div>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const timeEl = document.getElementById("timestamp");
      const messages = [
        "Design system sketching",
        "Writing case studies",
        "Refining layout and typography",
        "Optimizing performance"
      ];

      const msg = messages[Math.floor(Math.random() * messages.length)];
      statusEl.innerHTML = `<strong>Now:</strong> ${msg}`;

      const now = new Date();
      timeEl.textContent = `Last updated: ${now.toLocaleString()}`;
    </script>
  </body>
</html>
